name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy-production:
    name: Deploy to Production AWS EC2
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo "Connected to Production EC2..."
            cd SWE40006-Project || git clone https://github.com/HaydenJa27/SWE40006-Project.git && cd SWE40006-Project
            git fetch --all
            git checkout main
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker image prune -f
            echo "Production deployment completed successfully."
