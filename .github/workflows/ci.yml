name: CI Pipeline

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest with Coverage Check (>= 80%)
        run: |
          cd backend
          python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  build-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t swe40006-backend:test ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t swe40006-frontend:test ./frontend

  monitoring-validation:
    name: Monitoring Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: swe40006_db
          GRAFANA_ADMIN_PASSWORD: ci-test-password
        run: |
          docker compose config --quiet

      - name: Validate Prometheus Configuration
        run: |
          docker run --rm \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Prometheus Alert Rules
        run: |
          docker run --rm \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.5.0 \
            check rules /etc/prometheus/alerts.yml

            - name: Validate Grafana Configuration
        run: |
          python -m pip install pyyaml

          python - <<'PY'
          import json
          import yaml
          from pathlib import Path

          root = Path("monitoring/grafana")

          for path in root.rglob("*.yml"):
              with path.open() as f:
                  yaml.safe_load(f)
              print(f"Valid YAML: {path}")

          for path in root.rglob("*.yaml"):
              with path.open() as f:
                  yaml.safe_load(f)
              print(f"Valid YAML: {path}")

          for path in root.rglob("*.json"):
              with path.open() as f:
                  json.load(f)
              print(f"Valid JSON: {path}")
          PY

  integration-test:
    name: Full Stack Integration Test
    runs-on: ubuntu-latest
    needs:
      - monitoring-validation
      - build-validation

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: swe40006_db
      GRAFANA_ADMIN_PASSWORD: ci-test-password

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Start Docker Compose Stack
        run: |
          docker compose up -d --build

      - name: Wait for Backend Health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "Backend healthy"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 5
          done

          echo "Backend failed health check"
          exit 1

      - name: Verify Frontend
        run: |
          curl --fail --silent --show-error http://localhost/

      - name: Verify Prometheus
        run: |
          curl --fail --silent --show-error \
            http://localhost:9090/-/ready

      - name: Verify Grafana
        run: |
          curl --fail --silent --show-error \
            http://localhost:3001/api/health

      - name: Verify Prometheus Targets
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          expected = {
              "prometheus",
              "inventory-backend",
              "node-exporter",
              "postgres-exporter",
          }

          for attempt in range(30):
              try:
                  with urllib.request.urlopen(
                      "http://localhost:9090/api/v1/targets"
                  ) as response:
                      data = json.load(response)

                  targets = {
                      target["labels"]["job"]: target["health"]
                      for target in data["data"]["activeTargets"]
                  }

                  if all(
                      targets.get(job) == "up"
                      for job in expected
                  ):
                      print("All Prometheus targets are UP")
                      break

                  print(f"Waiting for targets: {targets}")

              except Exception as exc:
                  print(f"Prometheus not ready: {exc}")

              time.sleep(5)
          else:
              raise SystemExit("Prometheus targets failed health verification")
          PY

      - name: Display Container Logs on Failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100

      - name: Stop Containers
        if: always()
        run: |
          docker compose down