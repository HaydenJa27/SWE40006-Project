services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: swe40006-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-swe40006_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-swe40006_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # FastAPI Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swe40006-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-swe40006_db}
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # React Frontend (Nginx SPA) Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    container_name: swe40006-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Prometheus Monitoring Service
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: swe40006-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Grafana Dashboard Service
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: swe40006-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Node Exporter (Host System Metrics: CPU, RAM, Disk, Network)
  # ----------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:latest
    container_name: swe40006-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local
  grafana_data:
    driver: local

networks:
  app-network:
    driver: bridge
